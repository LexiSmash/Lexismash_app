name: lexismash_app
description: "Involucro nativo per gli store che mostra LexiSmash (lexismash.it) come un'app installata sul dispositivo."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'   # 16/11/2026: serve per onPopInvokedWithResult (Flutter 3.24+)

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  # D2 (17/11/2026): migliorie native. Tutte librerie libere, senza Google Play
  # Services: l'app resta pubblicabile su F-Droid.
  webview_flutter_android: ^4.0.0   # file, permessi e audio della WebView su Android
  url_launcher: ^6.3.0              # link esterni nel browser o nell'app giusta
  share_plus: ^13.3.1               # menu Condividi del telefono (API SharePlus.instance)
  wakelock_plus: ^1.2.8             # schermo acceso durante la partita
  permission_handler: ^13.0.2       # permesso del microfono
  speech_to_text: ^7.0.0            # comandi vocali con il riconoscimento del telefono
  file_selector: ^1.0.3             # scelta dei file (Jukebox, impostazioni, video), libreria ufficiale di Flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1   # D1 (16/11/2026): icona dell'app da assets/icon/

flutter:
  uses-material-design: true

# D1 (16/11/2026): icona dell'app, generata con «dart run flutter_launcher_icons»
# (lo fa da solo strumenti/prepara-android.ps1). Stessa immagine della PWA del sito.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  remove_alpha_ios: true
